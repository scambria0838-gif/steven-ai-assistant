<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steven AI Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0a0a0a; color: #fff; }
    header { padding: 2rem; text-align: center; }
    h1 { margin: 0; font-size: 2rem; }
    p { opacity: 0.8; }
    #chat-wrap { max-width: 480px; margin: 2rem auto; height: 70vh; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .bpFab { display: none !important; }
    .bpWebchat { position: absolute !important; top:0 !important; left:0 !important; right:0 !important; bottom:0 !important; width:100% !important; height:100% !important; }
  </style>
</head>
<body>
  <header>
    <h1>Steven AI Assistant</h1>
    <p>Ask anything. Leads get texted to the owner instantly.</p>
  </header>
  <div id="chat-wrap">
    <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
    <script>
      window.botpress.on('webchat:initialized', () => { window.botpress.open(); });
      window.botpress.init({
        botId: "PLACEHOLDER_BOT_ID",
        configuration: { website: {}, variant: "soft", themeMode: "dark", fontFamily: "inter" },
        clientId: "PLACEHOLDER_CLIENT_ID"
      });
    </script>
  </div>
  <script src="sms-notify.js"></script>
</body>
</html>
